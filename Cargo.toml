[package]
name = "mission-control"
version = "0.1.0"
edition = "2021"
description = "Async human-in-the-loop decision queue — Rust reimplementation of the Python prototype"
license = "MIT"

# The binary is named `mc-server` so it reads clearly alongside the CLIs
# (`ask`/`answers`) that will follow in later increments of the Rust port.
[[bin]]
name = "mc-server"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"], default-features = false }
base64 = "0.22"
getrandom = "0.2"
fs2 = "0.4"
constant_time_eq = "0.3"

[profile.release]
strip = true
lto = true
